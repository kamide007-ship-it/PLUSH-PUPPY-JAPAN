# ============================================
# Render.com デプロイ設定 (Infrastructure as Code)
# ============================================
# このファイルがリポジトリ直下にあると、Render が
# サービスを自動構成します。
# 
# Renderダッシュボード → "New +" → "Blueprint" →
# このリポジトリを選択するだけで全てが自動構築されます。
# ============================================

services:
  - type: web
    name: plush-puppy-coat-clinic
    runtime: static
    buildCommand: ""           # 静的ファイルのみ、ビルド不要
    staticPublishPath: .       # リポジトリのルートをそのまま公開
    pullRequestPreviewsEnabled: true
    headers:
      # セキュリティヘッダ
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL        # makeshop からの iframe 埋め込みを許可
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # CDN キャッシュ (画像・JS等)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      # SEO: 正規URLを HTTP ヘッダーでも明示 (HTML の <link rel=canonical> と併用)
      # 注意: Netlify 形式の _headers ファイルは Render では読まれないため、
      #       ヘッダー設定は必ずこの render.yaml に書くこと。
      - path: /
        name: Link
        value: <https://plush-puppy-coat-clinic.onrender.com/>; rel="canonical"
      - path: /index.html
        name: Link
        value: <https://plush-puppy-coat-clinic.onrender.com/>; rel="canonical"
      # クローラ向けファイルは短めのキャッシュで更新を反映しやすくする
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=3600
    routes:
      # SPA ではないので不要だが、404 を index.html に倒さない
      - type: rewrite
        source: /healthz
        destination: /index.html
